[project]
name = "attackpath"
version = "0.1.0"
description = "Temporal graph learning for cyber attack-path forecasting and adaptive defense"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "networkx>=3.2",
]

[project.optional-dependencies]
ml = ["torch>=2.2", "torch-geometric>=2.5", "scikit-learn>=1.4", "wandb>=0.16"]
app = ["fastapi>=0.110", "uvicorn>=0.29", "streamlit>=1.33", "plotly>=5.20", "reportlab>=4.0"]
dev = ["pytest>=8", "jupyter>=1.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attackpath"]

[tool.pytest.ini_options]
testpaths = ["tests"]
